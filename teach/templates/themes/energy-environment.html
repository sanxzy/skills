<!doctype html>
<html lang="en">
<head>
  <!-- ═══════════════ THEME: ENERGY & ENVIRONMENT ═══════════════
       Industries (industries.md): #5 Energy & Utilities, #20 Environmental & Sustainability.
       Vibe    : energy transition — moss green, load gauge, technical labels.
       Motif   : load gauge card — numbers & direction speak the field's language.
       Usage   : paste the blocks below into the lesson-template.html head
                 (replace the universal font links + <style> blocks), then paste
                 <div data-theme-signature…> into <section data-scn-stage>
                 as the first element. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    @theme {
      --color-brand: #16A34A;
      --color-ink: #052E16;
      --color-steel: #6B7280;
      --color-paper: #F8FAFC;
      --color-soft: #DCFCE7;
      --color-panel: #052E16;
      --color-pinline: #14532D;
      --color-ok: #0D9488;
      --color-mut: #D97706;
    }
  </style>
  <style>:root { --scn-accent: #16A34A; --scn-tint: #DCFCE7; --scn-ink: #052E16; }</style>

  <!-- Signature: load gauge -->
  <div data-theme-signature class="mb-5 flex items-center gap-4 rounded-lg border border-brand/25 bg-soft/40 px-4 py-3">
    <svg class="h-10 w-10 shrink-0" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M6 30 A14 14 0 0 1 34 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="text-ink/15"></path>
      <path d="M6 30 A14 14 0 0 1 24 18.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="text-brand" stroke-dasharray="37 5"></path>
      <line x1="20" y1="30" x2="26" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="text-ink"></line>
      <circle cx="20" cy="30" r="2.5" fill="currentColor" class="text-ink"></circle>
    </svg>
    <div class="min-w-0">
      <p class="font-mono text-[11px] font-semibold uppercase tracking-[0.15em] text-steel">Load</p>
      <p class="truncate text-sm font-semibold text-ink">Optimal · 68%</p>
    </div>
  </div>
</head>
