<!doctype html>
<html lang="en">

       Industries (industries.md #11): agriculture, plantation, livestock, fisheries,
       aquaculture, agritech, food processing, food distribution & delivery,
       alternative protein.
       Vibe    : field & harvest — moss green, season chips, earthy labels.
       Motif   : season chip + stage label (a cycle is a real sequence).
       Usage   : paste the blocks below into the lesson-template.html head
                 (replace the universal font links + <style> blocks), then paste
                 <div data-theme-signature…> into <section data-scn-stage>
                 as the first element. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

      --color-ink: #1C1917;
      --color-steel: #78716C;
      --color-paper: #FAFAF9;
      --color-soft: #ECFCCB;
      --color-panel: #1C1917;
      --color-pinline: #292524;

    <div class="min-w-0">
      <p class="font-mono text-[11px] font-semibold uppercase tracking-[0.15em] text-steel">Season</p>
      <p class="truncate text-sm font-semibold text-ink">Sow → Grow → Harvest</p>
